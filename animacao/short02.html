<script>const SCENES = [["h0", 0.0, 7.684], ["p1", 7.684, 9.875], ["p2", 9.875, 18.215], ["p3", 18.215, 26.589], ["a1", 26.589, 36.665], ["a2", 36.665, 37.42], ["a3", 37.42, 44.204], ["a4", 44.204, 47.231], ["a5", 47.231, 53.178], ["s1", 53.178, 55.596], ["s2", 55.596, 58.996], ["s3", 58.996, 63.675], ["s4", 63.675, 67.384], ["s5", 67.384, 73.378], ["s6", 73.378, 76.405], ["out", 76.405, 82.022]];
const CAPTIONS = [];
const HIGHLIGHT = [];
const POPS = {"h0h": 0.03, "hz": 0.955, "hp": 1.182, "hs": 1.864, "p1h": 7.714, "pp0": 8.745, "pp1": 8.815, "pp2": 8.885, "pp3": 8.955, "pp4": 9.025, "pp5": 9.095, "pp6": 9.165, "pp7": 9.235, "p2h": 9.905, "itf": 12.227, "bp0": 13.938, "bp1": 14.008, "bp2": 14.078, "bp3": 14.148, "bp4": 14.218, "bp5": 14.288, "bp6": 14.358, "bp7": 14.428, "p2t": 17.313, "p3h": 18.245, "sa0": 18.522, "sa1": 18.976, "sa2": 21.022, "p3t": 21.476, "p3y": 25.005, "a1h": 26.619, "a1t": 30.678, "bt": 35.536, "ch": 36.218, "a2h": 36.695, "a2x": 36.973, "a3h": 37.45, "ht0": 39.773, "ht1": 41.364, "a3t": 39.773, "a4h": 44.234, "usf": 44.511, "a4t": 45.193, "a5h": 47.261, "bt5": 48.567, "a5t": 51.067, "s1h": 53.208, "flag": 54.467, "flagx": 54.922, "s2h": 55.626, "t0": 55.904, "t1": 56.885, "t2": 58.095, "s3h": 59.026, "pin": 60.44, "year": 63.18, "s4h": 63.705, "name": 65.573, "s5h": 67.414, "fire": 68.6, "i0": 71.795, "i1": 71.865, "i2": 71.935, "i3": 72.005, "i4": 72.075, "i5": 72.145, "i6": 72.215, "i7": 72.285, "i8": 72.355, "i9": 72.425, "i10": 72.495, "i11": 72.565, "i12": 72.635, "i13": 72.705, "s6h": 73.408, "outh": 76.435, "outb": 78.604, "outt": 79.131};
const GUS_IDS = ["g0", "gp2", "ga4", "g1", "g6", "go"];
const TEAR = 73.45818181818184, CROUTON_DROP = 75.02636363636367, FALL = 0.35, BOUNCE = 0.3, SHOW_CAPTIONS = false;

const clamp = x => Math.max(0, Math.min(1, x));
const outBack = t => { const c = 1.9; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const $ = id => document.getElementById(id);
function scaleAround(el, s, extra) {
  const [cx, cy] = el.dataset.c.split(',').map(Number);
  el.setAttribute('transform', `${extra || ''} translate(${cx},${cy}) scale(${s}) translate(${-cx},${-cy})`);
}
function caption(t) {
  const c = CAPTIONS.find(c => t >= c[0] && t < c[1]);
  const el = $('cap');
  if (!c) { el.innerHTML = ''; return; }
  const words = c[2].split(' ');
  const size = c[2].length > 21 ? 70 : 86;
  el.setAttribute('font-size', size);
  if (el.dataset.cur !== c[2]) {
    el.innerHTML = words.map(w => `<tspan fill="${HIGHLIGHT.includes(w) ? '#F5D547' : '#FFFFFF'}">${w} </tspan>`).join('');
    el.dataset.cur = c[2];
  }
  const s = 0.82 + 0.18 * outBack(clamp((t - c[0]) / 0.14));
  $('capg').setAttribute('transform', `translate(540,1395) scale(${s}) translate(-540,-1395)`);
}
function setT(t, frame) {
  $('turb').setAttribute('seed', [7, 11, 19][Math.floor(t * 6) % 3]);
  for (const [id, a, b] of SCENES) {
    const el = $(id), on = t >= a && t < b;
    el.style.display = on ? '' : 'none';
    if (on) {
      // entrada rápida + zoom lento + "soquinho" de câmera a cada item que aparece
      let kick = 0;
      for (const t0 of Object.values(POPS)) if (t0 >= a && t >= t0) kick += 0.03 * Math.exp(-(t - t0) * 12);
      const k = 1.10 - 0.10 * outBack(clamp((t - a) / 0.16)) + 0.04 * (t - a) / (b - a) + kick;
      el.setAttribute('transform', `translate(540,900) scale(${k}) translate(-540,-900)`);
    }
  }
  for (const [id, t0] of Object.entries(POPS)) {
    const el = $(id); if (el) scaleAround(el, outBack(clamp((t - t0) / 0.15)));
  }
  // Gus respira / balança
  for (const id of GUS_IDS) {
    $(id).setAttribute('transform', `translate(0,${Math.sin(t * 5.5) * 10}) rotate(${Math.sin(t * 3.4) * 3} 500 560)`);
  }
  // lágrima do César
  const tl = ((t - TEAR) % 1.2 + 1.2) % 1.2;
  $('tear').setAttribute('transform', `translate(0,${tl * 120})`);
  $('tear').style.opacity = t > TEAR ? 1 - tl / 1.2 : 0;
  // croûton cai e quica na base do busto
  const ct = t - CROUTON_DROP;
  let cy = -700;
  if (ct > 0) { const g = Math.min(ct, FALL) / FALL; cy = -700 + 700 * g * g;
    if (ct > FALL) { const b = (ct - FALL) / BOUNCE; cy = b < 1 ? -90 * Math.sin(Math.PI * b) : 0; } }
  $('cr').setAttribute('transform', `translate(0,${cy}) rotate(${ct > 0 ? Math.min(ct, 0.8) * 200 : 0} 400 448)`);
  if (SHOW_CAPTIONS) caption(t);
}
